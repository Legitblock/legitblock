name: Monorepo CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suites & Build Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Core Utils (15 Test Suites)
        run: pnpm --filter @legitblock/legitblock-utils test

      - name: Build Next.js Governance Portal
        run: pnpm --filter nextjs-legitblock build

      - name: Verify Ink Terminal CLI
        run: node apps/ink-legitblock/src/cli.js --help
