name: Deploy Redirect to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Generate Redirect Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Create Redirect Files
        run: |
          mkdir -p out
          cat << 'EOF' > out/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Redirecting to LegitBlock...</title>
            <meta http-equiv="refresh" content="0; url=https://legitblock.github.io/">
            <link rel="canonical" href="https://legitblock.github.io/">
            <script>
              var path = window.location.pathname.replace(/^\/legitblock/, '') || '/';
              var target = 'https://legitblock.github.io' + (path.startsWith('/') ? path : '/' + path) + window.location.search + window.location.hash;
              window.location.replace(target);
            </script>
          </head>
          <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b1120; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
            <div style="text-align: center; padding: 20px;">
              <h2>Redirecting to LegitBlock Official Portal...</h2>
              <p style="color: #94a3b8;">If you are not redirected automatically, <a href="https://legitblock.github.io/" style="color: #10b981;">click here</a>.</p>
            </div>
          </body>
          </html>
          EOF
          cp out/index.html out/404.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://legitblock.github.io/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
